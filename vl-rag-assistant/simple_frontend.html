<!-- Vancouver Laser AI Assistant Widget -->
<div id="vl-ai-widget">
  <!-- Floating Button -->
  <button id="vl-ai-toggle" aria-label="Open chat assistant">
    <span class="vl-ai-toggle-icon">✦</span>
    <span class="vl-ai-toggle-text">Ask VL</span>
  </button>

  <!-- Chat Window -->
  <div id="vl-ai-panel" aria-hidden="true">
    <div class="vl-ai-header">
      <div>
        <div class="vl-ai-title">Vancouver Laser Assistant</div>
        <div class="vl-ai-subtitle">Ask about treatments, concerns, and booking.</div>
      </div>

      <button id="vl-ai-close" aria-label="Close chat">×</button>
    </div>

    <div id="vl-ai-messages">
      <div class="vl-ai-message vl-ai-message-bot">
        <div class="vl-ai-bubble">
          Hi! How can I help you today?
        </div>
      </div>
    </div>

    <form id="vl-ai-form">
      <input
        id="vl-ai-input"
        type="text"
        placeholder="Ask a question..."
        autocomplete="off"
      />
      <button id="vl-ai-send" type="submit">Send</button>
    </form>
  </div>
</div>

<style>
  :root {
    --vl-ai-gold: #d4a84f;
    --vl-ai-gold-dark: #b9892f;
    --vl-ai-cream: #f8efe5;
    --vl-ai-cream-light: #fffaf4;
    --vl-ai-black: #222222;
    --vl-ai-gray: #6f6a64;
    --vl-ai-border: rgba(212, 168, 79, 0.35);
    --vl-ai-shadow: 0 18px 50px rgba(0, 0, 0, 0.18);
  }

  #vl-ai-widget {
    position: fixed;
    right: 28px;
    bottom: 28px;
    z-index: 999999;
    font-family: "Inter", "Helvetica Neue", Arial, sans-serif;
  }

  #vl-ai-toggle {
    display: flex;
    align-items: center;
    gap: 10px;
    border: none;
    border-radius: 999px;
    padding: 15px 22px;
    background: var(--vl-ai-black);
    color: #ffffff;
    font-size: 16px;
    font-weight: 500;
    cursor: pointer;
    box-shadow: var(--vl-ai-shadow);
    transition: transform 0.25s ease, background 0.25s ease, opacity 0.25s ease;
  }

  #vl-ai-toggle:hover {
    transform: translateY(-2px);
    background: #111111;
  }

  .vl-ai-toggle-icon {
    width: 30px;
    height: 30px;
    border-radius: 50%;
    background: var(--vl-ai-gold);
    color: #ffffff;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    font-size: 15px;
  }

  .vl-ai-toggle-text {
    line-height: 1;
  }

  #vl-ai-panel {
    position: absolute;
    right: 0;
    bottom: 76px;
    width: 390px;
    max-width: calc(100vw - 32px);
    height: 560px;
    max-height: calc(100vh - 120px);
    background: var(--vl-ai-cream-light);
    border: 1px solid var(--vl-ai-border);
    border-radius: 28px;
    box-shadow: var(--vl-ai-shadow);
    overflow: hidden;
    display: flex;
    flex-direction: column;
    opacity: 0;
    transform: translateY(18px) scale(0.96);
    pointer-events: none;
    transition: opacity 0.25s ease, transform 0.25s ease;
  }

  #vl-ai-panel.vl-ai-open {
    opacity: 1;
    transform: translateY(0) scale(1);
    pointer-events: auto;
  }

  .vl-ai-header {
    background: linear-gradient(135deg, #f7ead8 0%, #fffaf4 55%, #efd59f 100%);
    border-bottom: 1px solid var(--vl-ai-border);
    padding: 22px 22px 18px;
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 16px;
  }

  .vl-ai-title {
    font-family: Georgia, "Times New Roman", serif;
    font-size: 22px;
    line-height: 1.2;
    color: #111111;
  }

  .vl-ai-subtitle {
    margin-top: 6px;
    font-size: 13px;
    line-height: 1.4;
    color: var(--vl-ai-gray);
  }

  #vl-ai-close {
    width: 34px;
    height: 34px;
    border-radius: 50%;
    border: 1px solid var(--vl-ai-border);
    background: rgba(255, 255, 255, 0.65);
    color: var(--vl-ai-black);
    font-size: 24px;
    line-height: 1;
    cursor: pointer;
    transition: background 0.2s ease, transform 0.2s ease;
  }

  #vl-ai-close:hover {
    background: #ffffff;
    transform: rotate(90deg);
  }

  #vl-ai-messages {
    flex: 1;
    padding: 20px 18px;
    overflow-y: auto;
    background:
      radial-gradient(circle at top left, rgba(212, 168, 79, 0.12), transparent 32%),
      var(--vl-ai-cream-light);
  }

  .vl-ai-message {
    display: flex;
    margin-bottom: 14px;
  }

  .vl-ai-message-user {
    justify-content: flex-end;
  }

  .vl-ai-message-bot {
    justify-content: flex-start;
  }

  .vl-ai-bubble {
    max-width: 82%;
    padding: 13px 15px;
    border-radius: 18px;
    font-size: 14px;
    line-height: 1.55;
    white-space: pre-wrap;
    word-break: break-word;
  }

  .vl-ai-message-user .vl-ai-bubble {
    background: var(--vl-ai-black);
    color: #ffffff;
    border-bottom-right-radius: 6px;
  }

  .vl-ai-message-bot .vl-ai-bubble {
    background: #ffffff;
    color: var(--vl-ai-black);
    border: 1px solid rgba(212, 168, 79, 0.22);
    border-bottom-left-radius: 6px;
  }

  .vl-ai-sources {
    margin-top: 10px;
    padding-top: 10px;
    border-top: 1px solid rgba(212, 168, 79, 0.25);
    font-size: 12px;
    color: var(--vl-ai-gray);
  }

  .vl-ai-sources-title {
    margin-bottom: 5px;
    font-weight: 600;
    color: var(--vl-ai-black);
  }

  .vl-ai-source-link {
    display: block;
    color: var(--vl-ai-gold-dark);
    text-decoration: none;
    margin-top: 4px;
  }

  .vl-ai-source-link:hover {
    text-decoration: underline;
  }

  .vl-ai-typing {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    min-width: 46px;
  }

  .vl-ai-dot {
    width: 7px;
    height: 7px;
    background: var(--vl-ai-gold);
    border-radius: 50%;
    animation: vlAiWave 1.1s infinite ease-in-out;
  }

  .vl-ai-dot:nth-child(2) {
    animation-delay: 0.15s;
  }

  .vl-ai-dot:nth-child(3) {
    animation-delay: 0.3s;
  }

  @keyframes vlAiWave {
    0%, 80%, 100% {
      transform: translateY(0);
      opacity: 0.45;
    }

    40% {
      transform: translateY(-6px);
      opacity: 1;
    }
  }

  #vl-ai-form {
    display: flex;
    gap: 10px;
    padding: 16px;
    background: #ffffff;
    border-top: 1px solid var(--vl-ai-border);
  }

  #vl-ai-input {
    flex: 1;
    min-width: 0;
    border: 1px solid rgba(212, 168, 79, 0.38);
    border-radius: 999px;
    padding: 13px 15px;
    font-size: 14px;
    outline: none;
    color: var(--vl-ai-black);
    background: #fffaf4;
  }

  #vl-ai-input:focus {
    border-color: var(--vl-ai-gold);
    box-shadow: 0 0 0 3px rgba(212, 168, 79, 0.15);
  }

  #vl-ai-send {
    border: none;
    border-radius: 999px;
    padding: 0 18px;
    background: var(--vl-ai-gold);
    color: #ffffff;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    transition: background 0.2s ease, transform 0.2s ease;
  }

  #vl-ai-send:hover {
    background: var(--vl-ai-gold-dark);
    transform: translateY(-1px);
  }

  #vl-ai-send:disabled,
  #vl-ai-input:disabled {
    opacity: 0.55;
    cursor: not-allowed;
  }

  @media (max-width: 767px) {
    #vl-ai-widget {
      right: 16px;
      bottom: 16px;
    }

    #vl-ai-panel {
      width: calc(100vw - 32px);
      height: 70vh;
      bottom: 72px;
      border-radius: 24px;
    }

    #vl-ai-toggle {
      padding: 13px 18px;
      font-size: 15px;
    }

    .vl-ai-title {
      font-size: 20px;
    }
  }
</style>

<script>
  (function () {
    const API_URL = "http://127.0.0.1:8000/chat";

    const toggleButton = document.getElementById("vl-ai-toggle");
    const closeButton = document.getElementById("vl-ai-close");
    const panel = document.getElementById("vl-ai-panel");
    const form = document.getElementById("vl-ai-form");
    const input = document.getElementById("vl-ai-input");
    const messages = document.getElementById("vl-ai-messages");

    let sessionId = getOrCreateSessionId();

    toggleButton.addEventListener("click", function () {
      openPanel();
    });

    closeButton.addEventListener("click", function () {
      closePanel();
    });

    form.addEventListener("submit", async function (event) {
      event.preventDefault();

      const userMessage = input.value.trim();

      if (!userMessage) {
        return;
      }

      addMessage("user", userMessage);
      input.value = "";

      setInputState(false);

      const typingElement = addTypingIndicator();

      try {
        const response = await fetch(API_URL, {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({
            message: userMessage,
            session_id: sessionId
          })
        });

        const data = await response.json();

        typingElement.remove();

        if (!response.ok) {
          const errorMessage = getErrorMessage(data);
          addMessage("bot", "Sorry, something went wrong:\n" + errorMessage);
          return;
        }

        addBotResponse(data);
      } catch (error) {
        typingElement.remove();

        addMessage(
          "bot",
          "Sorry, I could not connect to the assistant server. Please make sure your FastAPI backend is running."
        );

        console.error(error);
      } finally {
        setInputState(true);
        input.focus();
      }
    });

    function openPanel() {
      panel.classList.add("vl-ai-open");
      panel.setAttribute("aria-hidden", "false");
      setTimeout(function () {
        input.focus();
      }, 200);
    }

    function closePanel() {
      panel.classList.remove("vl-ai-open");
      panel.setAttribute("aria-hidden", "true");
    }

    function addMessage(sender, text) {
      const message = document.createElement("div");
      message.className = "vl-ai-message vl-ai-message-" + sender;

      const bubble = document.createElement("div");
      bubble.className = "vl-ai-bubble";
      bubble.textContent = text;

      message.appendChild(bubble);
      messages.appendChild(message);

      scrollToBottom();

      return message;
    }

    function addBotResponse(data) {
      const answer = data.answer || "I received your question, but no answer was returned.";

      const message = document.createElement("div");
      message.className = "vl-ai-message vl-ai-message-bot";

      const bubble = document.createElement("div");
      bubble.className = "vl-ai-bubble";

      const answerText = document.createElement("div");
      answerText.textContent = answer;
      bubble.appendChild(answerText);

      if (Array.isArray(data.sources) && data.sources.length > 0) {
        const sourcesBox = document.createElement("div");
        sourcesBox.className = "vl-ai-sources";

        const sourcesTitle = document.createElement("div");
        sourcesTitle.className = "vl-ai-sources-title";
        sourcesTitle.textContent = "Sources";
        sourcesBox.appendChild(sourcesTitle);

        data.sources.slice(0, 3).forEach(function (source) {
          if (!source || !source.title) {
            return;
          }

          const sourceLink = document.createElement("a");
          sourceLink.className = "vl-ai-source-link";
          sourceLink.textContent = source.title;
          sourceLink.href = source.url || "#";
          sourceLink.target = "_blank";
          sourceLink.rel = "noopener noreferrer";

          sourcesBox.appendChild(sourceLink);
        });

        bubble.appendChild(sourcesBox);
      }

      message.appendChild(bubble);
      messages.appendChild(message);

      scrollToBottom();
    }

    function addTypingIndicator() {
      const message = document.createElement("div");
      message.className = "vl-ai-message vl-ai-message-bot";

      const bubble = document.createElement("div");
      bubble.className = "vl-ai-bubble";

      const typing = document.createElement("div");
      typing.className = "vl-ai-typing";
      typing.setAttribute("aria-label", "Assistant is typing");

      for (let i = 0; i < 3; i++) {
        const dot = document.createElement("span");
        dot.className = "vl-ai-dot";
        typing.appendChild(dot);
      }

      bubble.appendChild(typing);
      message.appendChild(bubble);
      messages.appendChild(message);

      scrollToBottom();

      return message;
    }

    function setInputState(enabled) {
      input.disabled = !enabled;
      document.getElementById("vl-ai-send").disabled = !enabled;
    }

    function scrollToBottom() {
      messages.scrollTop = messages.scrollHeight;
    }

    function getErrorMessage(data) {
      if (!data) {
        return "Unknown error.";
      }

      if (typeof data.detail === "string") {
        return data.detail;
      }

      if (Array.isArray(data.detail)) {
        return data.detail
          .map(function (item) {
            const location = item.loc ? item.loc.join(".") : "field";
            const message = item.msg || "Invalid value";
            return location + ": " + message;
          })
          .join("\n");
      }

      return JSON.stringify(data, null, 2);
    }

    function getOrCreateSessionId() {
      const storageKey = "vl_ai_session_id";
      let existingSessionId = localStorage.getItem(storageKey);

      if (existingSessionId) {
        return existingSessionId;
      }

      const newSessionId = "vl-session-" + Date.now() + "-" + Math.random().toString(16).slice(2);
      localStorage.setItem(storageKey, newSessionId);

      return newSessionId;
    }
  })();
</script>
